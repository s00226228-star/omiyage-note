function listing(m,pref){m.append(line(`${items.filter(x=>x.prefecture===pref).length}件の登録商品`,'muted small'));controls(m);m.append(el('div',{id:'list'}));updateList()}

function updateList(){let target=$('#list');if(!target)return;target.replaceChildren();let a=items.filter(p=>(view.page!=='pref'||p.prefecture===view.pref)&&(!filter.q||[p.name,p.shop,p.prefecture,p.memo,p.description,p.purchaseInfo,...(p.genres||[])].join(' ').toLocaleLowerCase('ja').includes(filter.q.trim().toLocaleLowerCase('ja')))&&(filter.rating==='すべて'||(p.rating||'未評価')===filter.rating)&&(filter.status==='すべて'||(p.status||'未購入')===filter.status));target.append(line(`${a.length}件`,'muted small'));productList(target,sortItems(a))}

function field(parent,label,key,val='',type='text'){let w=el('label',{class:'field'});w.append(el('span',{text:label}));let x=type==='textarea'?el('textarea',{name:key}):el('input',{name:key,type});x.value=val||'';w.append(x);parent.append(w);return x}

function settings(m){m.append(line('画像の一括管理','section'));let images=card();let zero=items.filter(p=>!(p.photos||[]).length).length;images.append(line(`写真0枚の商品：${zero}件`,'muted small'));images.append(btn('写真0枚の商品リストをJSON出力',photoSearchExport,'btn full alt'));images.append(el('div',{style:'height:10px'}));images.append(btn('画像ZIPを一括取り込み',()=>go('zipimport'),'btn full'));images.append(line('画像検索用JSONをChatGPTに送って画像ZIPを作成し、この画面から取り込めます。','tiny muted'));m.append(images);m.append(line('データ管理','section'));let c=card();c.append(line(`登録商品：${items.length}件`,'muted'));let stats=photoStats();c.append(line(`保存写真：${stats.count}枚／推定画像容量：${(stats.bytes/1024/1024).toFixed(1)}MB`,'muted small'));c.append(line('画像データの概算値です。ブラウザ全体の使用容量とは異なります。','tiny muted'));c.append(el('div',{style:'height:12px'}));c.append(btn('JSONバックアップを保存',()=>download('omiyage-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'omiyage-techo',version:1,exportedAt:now(),products:items},null,2),'application/json'),'btn full'));c.append(el('p',{class:'small muted',text:'商品・評価・メモ・写真・登録日をまとめて保存します。定期的にバックアップしてください。'}));let fi=el('input',{type:'file',accept:'.json,application/json'});fi.addEventListener('change',async()=>{let data;try{data=JSON.parse(await fi.files[0].text())}catch{return alert('JSONを読み込めませんでした')}if(!Array.isArray(data.products))return alert('バックアップ形式ではありません');if(!confirm(`バックアップ${data.products.length}件を復元します。\n同じIDの商品は上書きします。続行しますか？`))return;let count=0;for(let x of data.products){if(!x?.name||!PREFS.includes(x.prefecture))continue;let p=normalized(x);p.id=String(x.id||uid());p.createdAt=x.createdAt||now();p.updatedAt=x.updatedAt||p.createdAt;try{await put(p);count++}catch(e){alert('一部のデータを復元できませんでした');break}}toast(count+'件復元しました');render()});c.append(line('バックアップから復元','section'));c.append(fi);m.append(c);let d=card();d.append(line('JSON貼り付け登録','section'));d.append(btn('JSON一括登録を開く',()=>go('import'),'btn full alt'));m.append(d);m.append(el('div',{class:'notice',text:'データはこの端末のブラウザ内に保存されます。ブラウザデータの消去・端末故障・機種変更に備え、バックアップファイルを別の場所に保管してください。'}))}
