</style></head><body><div class="app"><header class="top"><button id="back" class="iconbtn hide" aria-label="戻る">‹</button><h1 id="title">お土産手帖</h1><button id="topAdd" class="iconbtn" aria-label="商品追加">＋</button></header><main id="main" class="main"></main></div><nav class="bottom"><div><button class="nav" data-nav="home"><b>⌂</b>地域</button><button class="nav" data-nav="search"><b>⌕</b>検索</button><button class="nav" data-nav="add"><b>＋</b>登録</button><button class="nav" data-nav="settings"><b>⚙</b>設定</button></div></nav><div id="toast"></div><script>

async function reload(){items=await new Promise((ok,no)=>{let r=db.transaction('products').objectStore('products').getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}

function toast(s){let x=$('#toast');x.textContent=s;x.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>x.style.display='none',2300)}

function heading(s,back=false){$('#title').textContent=s;$('#back').classList.toggle('hide',!back);$('#topAdd').classList.toggle('hide',view.page==='add'||view.page==='import');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.nav===view.page||(['region','pref','detail'].includes(view.page)&&x.dataset.nav==='home')))}
function btn(text,fn,cls='btn'){return el('button',{class:cls,text,onclick:fn})}function card(){return el('div',{class:'card'})}function line(s,cl=''){return el('div',{class:cl,text:s})}
function render(){let m=$('#main');m.replaceChildren();let p=view.page;heading(({home:'お土産手帖',region:view.region,pref:view.pref,detail:'商品詳細',add:editingId?'商品を編集':'商品を登録',search:'全国検索',settings:'設定',import:'JSON一括登録'})[p]||'お土産手帖',!['home','search','settings'].includes(p));if(p==='home')home(m);if(p==='region')region(m);if(p==='pref')listing(m,view.pref);if(p==='search')search(m);if(p==='detail')detail(m);if(p==='add')form(m);if(p==='settings')settings(m);if(p==='import')importPage(m)}
function home(m){m.append(line('地域から探す','section'));let g=el('div',{class:'grid'});for(let [r,ps] of Object.entries(REGIONS)){let n=items.filter(i=>ps.includes(i.prefecture)).length;g.append(el('button',{class:'tile',onclick:()=>go('region',{region:r}),html:`<strong>${esc(r)}</strong><span class="muted small">${n}件</span>`}))}m.append(g);m.append(line('最近登録した商品','section'));productList(m,sortItems(items).slice(0,6));if(!items.length)m.append(el('div',{class:'notice',text:'まずは「登録」から商品を追加するか、ChatGPTが作成したJSONを貼り付けてください。'}))}

function sortItems(a){let b=[...a];if(filter.sort==='rating')b.sort((x,y)=>RATINGS.indexOf(x.rating||'未評価')-RATINGS.indexOf(y.rating||'未評価')||(y.createdAt||'').localeCompare(x.createdAt||''));else b.sort((x,y)=>(y.createdAt||'').localeCompare(x.createdAt||''));return b}
function controls(m,showSearch=false){let c=card();if(showSearch){let q=el('input',{class:'search',placeholder:'商品名・店舗名・都道府県・メモなどを検索',value:filter.q});q.addEventListener('input',()=>{filter.q=q.value;updateList()});c.append(q)}let r=el('div',{class:'row',style:'margin-top:10px;flex-wrap:wrap'});for(let [key,opts] of [['sort',[['new','新しい順'],['rating','評価順']]],[ 'rating',['すべて',...RATINGS].map(x=>[x,x])],['status',['すべて',...STATUSES].map(x=>[x,x])]]){let s=el('select',{class:'search',style:'width:auto;max-width:100%;flex:1',onchange:()=>{filter[key]=s.value;updateList()}});opts.forEach(([v,t])=>s.append(el('option',{value:v,text:t})));s.value=filter[key];r.append(s)}c.append(r);m.append(c)}
function productList(m,a){if(!a.length){m.append(line('該当する商品がありません','empty'));return}for(let p of a){let b=el('button',{class:'product',onclick:()=>go('detail',{id:p.id})});let info=el('div',{class:'grow'});info.append(line(p.name,'name'));if(p.shop)info.append(line(p.shop,'muted small'));if(p.memo)info.append(line(p.memo,'memo'));b.append(info);b.append(line(p.rating&&p.rating!=='未評価'?p.rating:'—','rating '+(p.rating==='◎'?'best':(!p.rating||p.rating==='未評価'?'empty':''))));b.append(line('›','muted'));m.append(b)}}
function listing(m,pref){m.append(line(`${items.filter(x=>x.prefecture===pref).length}件の登録商品`,'muted small'));controls(m);m.append(el('div',{id:'list'}));updateList()}
function search(m){controls(m,true);m.append(el('div',{id:'list'}));updateList()}
function updateList(){let target=$('#list');if(!target)return;target.replaceChildren();let a=items.filter(p=>(view.page!=='pref'||p.prefecture===view.pref)&&(!filter.q||[p.name,p.shop,p.prefecture,p.memo,p.description,p.purchaseInfo,...(p.genres||[])].join(' ').toLocaleLowerCase('ja').includes(filter.q.trim().toLocaleLowerCase('ja')))&&(filter.rating==='すべて'||(p.rating||'未評価')===filter.rating)&&(filter.status==='すべて'||(p.status||'未購入')===filter.status));target.append(line(`${a.length}件`,'muted small'));productList(target,sortItems(a))}
function section(m,title,text){m.append(line(title,'section'));let c=card();c.append(line(text||'—','pre'));m.append(c)}
function detail(m){let p=items.find(x=>x.id===view.id);if(!p){m.append(line('商品が見つかりません','empty'));return}if(p.photos?.length){let photo=el('img',{class:'photo',src:p.photos[0],alt:p.name});m.append(photo);if(p.photos.length>1){let row=el('div',{class:'row',style:'overflow:auto;margin-top:8px'});p.photos.forEach(src=>row.append(el('img',{class:'thumb',src,onclick:()=>photo.src=src})));m.append(row)}}m.append(el('h2',{text:p.name,style:'margin:15px 0 3px;font-size:24px'}));if(p.shop)m.append(line(p.shop,'muted'));m.append(line('登録日：'+date(p.createdAt),'date'));m.append(line('最終更新日：'+date(p.updatedAt||p.createdAt),'date'));let tags=el('div',{style:'margin-top:10px'});[p.prefecture,...(p.genres||[])].filter(Boolean).forEach(t=>tags.append(line(t,'tag')));m.append(tags);if(p.price){m.append(line('参考価格','section'));m.append(line(p.price,'price'))}m.append(line('自分の評価','section'));let rc=el('div',{class:'chips'});RATINGS.forEach(v=>rc.append(btn(v,async()=>{p.rating=v;p.updatedAt=now();await put(p);render();toast('評価を更新しました')},'choice '+((p.rating||'未評価')===v?'on':''))));m.append(rc);m.append(line('購入・試食状況','section'));let sc=el('div',{class:'chips'});STATUSES.forEach(v=>sc.append(btn(v,async()=>{p.status=v;p.updatedAt=now();await put(p);render();toast('状況を更新しました')},'choice '+((p.status||'未購入')===v?'on':''))));m.append(sc);section(m,'商品説明',p.description);if(p.purchaseInfo)section(m,'購入情報',p.purchaseInfo);m.append(line('自分のメモ','section'));let memo=el('textarea',{class:'search',style:'min-height:95px',placeholder:'味の感想、購入時のメモなど'});memo.value=p.memo||'';m.append(memo);m.append(btn('メモを保存',async()=>{p.memo=memo.value;p.updatedAt=now();await put(p);render();toast('メモを保存しました')},'btn alt sm'));if(p.url||p.sourceUrl){m.append(line('関連リンク','section'));let c=card();for(let [u,t] of [[p.url,'販売・公式ページ'],[p.sourceUrl,'発見元のリンク']])if(u&&/^https?:\/\//i.test(u))c.append(el('div',{style:'margin:8px 0'},[el('a',{href:u,target:'_blank',rel:'noopener noreferrer',text:t+' ↗'})]));m.append(c)} function field(parent,label,key,val='',type='text'){let w=el('label',{class:'field'});w.append(el('span',{text:label}));let x=type==='textarea'?el('textarea',{name:key}):el('input',{name:key,type});x.value=val||'';w.append(x);parent.append(w);return x}
function selectField(parent,label,key,opts,val){let w=el('label',{class:'field'});w.append(el('span',{text:label}));let s=el('select',{name:key});opts.forEach(x=>s.append(el('option',{value:x,text:x})));s.value=val||opts[0];w.append(s);parent.append(w);return s}
function form(m){m.append(el('div',{class:'notice',text:'ChatGPTで作成したJSONをお持ちの場合は、こちらから貼り付け登録できます。'}));m.append(btn('JSONを貼り付けて登録',()=>go('import'),'btn full alt'));let p=items.find(x=>x.id===editingId)||{};let f=el('form');field(f,'商品名 *','name',p.name);field(f,'店舗・製造者','shop',p.shop);selectField(f,'都道府県 *','prefecture',['',...PREFS],p.prefecture);let g=el('div',{class:'field'});g.append(el('span',{text:'ジャンル（最大2つ）'}));let cg=el('div',{class:'chips'});let selected=[...(p.genres||[])];GENRES.forEach(v=>{let b=btn(v,()=>{if(selected.includes(v))selected=selected.filter(x=>x!==v);else if(selected.length<2)selected.push(v);else return toast('ジャンルは最大2つです');cg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',selected.includes(x.textContent)))},'choice '+(selected.includes(v)?'on':''));b.type='button';cg.append(b)});g.append(cg);f.append(g);field(f,'商品説明','description',p.description,'textarea');field(f,'参考価格','price',p.price);field(f,'購入情報','purchaseInfo',p.purchaseInfo,'textarea');field(f,'自分のメモ','memo',p.memo,'textarea');selectField(f,'評価','rating',RATINGS,p.rating||'未評価');selectField(f,'購入・試食状況','status',STATUSES,p.status||'未購入');field(f,'公式・販売URL','url',p.url,'url');field(f,'発見元URL','sourceUrl',p.sourceUrl,'url');let w=el('div',{class:'field'});w.append(line('写真（最大5枚）','section'));let preview=el('div',{class:'row',style:'flex-wrap:wrap'});function showPhotos(){preview.replaceChildren();draftPhotos.forEach((src,i)=>{let x=el('div',{style:'position:relative'});x.append(el('img',{class:'thumb',src}));x.append(btn('×',()=>{draftPhotos.splice(i,1);showPhotos()},'btn danger sm'));preview.append(x)})}showPhotos();w.append(preview);let fi=el('input',{type:'file',accept:'image/*',multiple:'multiple'});fi.addEventListener('change',async()=>{for(let file of fi.files){if(draftPhotos.length>=5){toast('写真は最大5枚です');break}try{draftPhotos.push(await compress(file))}catch(e){toast('画像を読み込めませんでした')}}showPhotos();fi.value=''});w.append(fi);f.append(w);let save=btn('商品を保存',()=>{},'btn full');save.type='submit';f.append(save);f.addEventListener('submit',async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(f).entries());v.name=v.name?.trim();if(!v.name||!PREFS.includes(v.prefecture))return alert('商品名と都道府県を入力してください');let old=items.find(x=>x.id===editingId);let x={...old,...v,id:old?.id||uid(),genres:selected,photos:[...draftPhotos],createdAt:old?.createdAt||now(),updatedAt:now()};try{await put(x);editingId=null;draftPhotos=[];go('detail',{id:x.id});toast('保存しました')}catch(err){alert('保存できませんでした。写真容量または端末の空き容量をご確認ください。')}});m.append(f)}
function compress(file){return new Promise((resolve,reject)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let scale=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.78))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('画像エラー'))};img.src=url})}
function normalized(o){let p={...o};p.name=String(p.name||'').trim();p.shop=String(p.shop||'');p.prefecture=String(p.prefecture||'');p.rating=RATINGS.includes(p.rating)?p.rating:'未評価';p.status=STATUSES.includes(p.status)?p.status:'未購入';p.genres=Array.isArray(p.genres)?p.genres.filter(x=>GENRES.includes(x)).slice(0,2):[];p.photos=Array.isArray(p.photos)?p.photos.filter(x=>typeof x==='string'&&x.startsWith('data:image/')).slice(0,5):[];for(let k of ['description','memo','price','purchaseInfo','url','sourceUrl'])p[k]=String(p[k]||'');return p}
function importPage(m){m.append(el('div',{class:'notice',text:'ChatGPTが作成した商品JSONを貼り付けて登録できます。1件のオブジェクト、複数件の配列、または {"products":[...]} に対応します。写真は別途追加してください。'}));let ta=el('textarea',{class:'search',style:'margin-top:15px;min-height:240px',placeholder:'{"name":"喜作乃島大東寿司","prefecture":"沖縄県",...}'});m.append(ta);m.append(btn('JSONを読み込む',async()=>{let data;try{data=JSON.parse(ta.value)}catch{return alert('JSON形式が正しくありません')}let arr=Array.isArray(data)?data:Array.isArray(data.products)?data.products:[data];if(!arr.length)return alert('商品がありません');let added=0,merged=0,skipped=0;for(let raw of arr){if(!raw||typeof raw!=='object')continue;let p=normalized(raw);if(!p.name||!PREFS.includes(p.prefecture)){skipped++;continue}let old=items.find(x=>x.name.trim().toLowerCase()===p.name.toLowerCase()&&x.prefecture===p.prefecture);if(old){let choice=prompt(`「${p.name}」は登録済みです。\n1：既存商品に統合（既存の評価・メモを優先）\n2：別商品として追加\n3：スキップ`,'3');if(choice==='3'||choice===null){skipped++;continue}if(choice==='1'){p={...old,...Object.fromEntries(Object.entries(p).filter(([k,v])=>!['rating','status','memo','photos','createdAt','id'].includes(k)&&v!==''&&!(Array.isArray(v)&&!v.length))),updatedAt:now()};merged++}else if(choice==='2'){p={...p,id:uid(),createdAt:new Date(Date.now()+added).toISOString(),updatedAt:now()};added++}else{skipped++;continue}}else{p={...p,id:uid(),createdAt:new Date(Date.now()+added).toISOString(),updatedAt:now()};added++}try{await put(p)}catch(e){alert('保存中にエラーが発生しました');break}}toast(`新規${added}件・統合${merged}件・スキップ${skipped}件`);go('home')},'btn full'));m.append(line('入力例','section'));let ex=card();ex.append(el('pre',{class:'pre tiny',text:JSON.stringify({name:'喜作乃島大東寿司',shop:'割烹喜作',prefecture:'沖縄県',description:'南大東島名物の漬け寿司。',rating:'未評価',status:'未購入',price:'950円（税込・6貫）',purchaseInfo:'那覇空港で販売。',sourceUrl:'https://x.com/'},null,2)}));m.append(ex)}
function download(name,contents,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([contents],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function settings(m){m.append(line('データ管理','section'));let c=card();c.append(line(`登録商品：${items.length}件`,'muted'));c.append(el('div',{style:'height:12px'}));c.append(btn('JSONバックアップを保存',()=>download('omiyage-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'omiyage-techo',version:1,exportedAt:now(),products:items},null,2),'application/json'),'btn full'));c.append(el('p',{class:'small muted',text:'商品・評価・メモ・写真・登録日をまとめて保存します。定期的にバックアップしてください。'}));let fi=el('input',{type:'file',accept:'.json,application/json'});fi.addEventListener('change',async()=>{let data;try{data=JSON.parse(await fi.files[0].text())}catch{return alert('JSONを読み込めませんでした')}if(!Array.isArray(data.products))return alert('バックアップ形式ではありません');if(!confirm(`バックアップ${data.products.length}件を復元します。\n同じIDの商品は上書きします。続行しますか？`))return;let count=0;for(let x of data.products){if(!x?.name||!PREFS.includes(x.prefecture))continue;let p=normalized(x);p.id=String(x.id||uid());p.createdAt=x.createdAt||now();p.updatedAt=x.updatedAt||p.createdAt;try{await put(p);count++}catch(e){alert('一部のデータを復元できませんでした');break}}toast(count+'件復元しました');render()});c.append(line('バックアップから復元','section'));c.append(fi);m.append(c);let d=card();d.append(line('JSON貼り付け登録','section'));d.append(btn('JSON一括登録を開く',()=>go('import'),'btn full alt'));m.append(d);m.append(el('div',{class:'notice',text:'データはこの端末のブラウザ内に保存されます。ブラウザデータの消去・端末故障・機種変更に備え、バックアップファイルを別の場所に保管してください。'}))}
$('#back').onclick=()=>{if(history.state?.omiyageView&&view.page!=='home')history.back();else go('home')};$('#topAdd').onclick=()=>{editingId=null;draftPhotos=[];go('add')};document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{let page=b.dataset.nav;if(page==='add'){editingId=null;draftPhotos=[]}go(page)});
(async()=>{try{db=await openDB();await reload();render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){$('#main').textContent='保存領域を利用できません。ブラウザのプライベートモードや設定をご確認ください。'}})();
</script></body></html>
